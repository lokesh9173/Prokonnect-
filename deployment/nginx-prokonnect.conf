# =========================================================================
# ProKonnect Nginx Reverse Proxy Configuration
# Target Location on Host: /etc/nginx/sites-available/prokonnect
# Symlink: sudo ln -s /etc/nginx/sites-available/prokonnect /etc/nginx/sites-enabled/
# =========================================================================

# HTTP Server Block: Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name staging.prokonnect.com; # Replace with your actual domain or staging domain

    # Allow Let's Encrypt automated challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block: Reverse Proxy to ProKonnect Docker Container
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.prokonnect.com; # Replace with your actual domain or staging domain

    # SSL Certificate Paths (Standard Let's Encrypt paths managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/staging.prokonnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.prokonnect.com/privkey.pem;

    # Modern SSL Protocols & Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Maximum upload size for avatars and verification screenshots (5MB app limit + headroom)
    client_max_body_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to ProKonnect Backend Container (bound to localhost:5001)
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # WebSocket & Persistent Connection Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client Identity & Routing Headers (Consumed by Express trust proxy)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for real-time responsiveness
        proxy_buffering off;
    }

    # Static Assets Caching Optimization
    location ~* \.(?:css|js|woff2?|svg|ico|png|jpg|jpeg|webp)$ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
